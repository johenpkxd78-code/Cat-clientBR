pluginManagement {
    repositories {
        maven {
            url = uri('https://' + 'maven.architectury.dev/')
        }

        maven {
            url = uri('https://' + 'repo.essential.gg/repository/maven-releases/')
        }

        gradlePluginPortal()
        mavenCentral()

        maven {
            url = uri('https://' + 'maven.fabricmc.net/')
        }

        maven {
            url = uri('https://' + 'maven.minecraftforge.net/')
        }
    }

    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'gg.essential.loom') {
                useModule(
                    "gg.essential:architectury-loom:${requested.version}"
                )
            }
        }
    }
}

rootProject.name = 'CatClient'
