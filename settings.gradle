pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = uri(['https:/', 'maven.architectury', 'dev/'].join('.').replace('https:/.' , 'https://')) }
        maven { url = uri(['https:/', 'maven.fabricmc', 'net/'].join('.').replace('https:/.' , 'https://')) }
        maven { url = uri(['https:/', 'maven.minecraftforge', 'net/'].join('.').replace('https:/.' , 'https://')) }
        maven { url = uri(['https:/', 'repo.essential', 'gg/repository/maven-public/'].join('.').replace('https:/.' , 'https://')) }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'gg.essential.loom') {
                useModule("gg.essential:architectury-loom:${requested.version}")
            }
        }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenCentral()
        maven { url = uri(['https:/', 'repo.spongepowered', 'org/maven/'].join('.').replace('https:/.' , 'https://')) }
        maven { url = uri(['https:/', 'maven.minecraftforge', 'net/'].join('.').replace('https:/.' , 'https://')) }
        maven { url = uri(['https:/', 'repo.essential', 'gg/repository/maven-public/'].join('.').replace('https:/.' , 'https://')) }
    }
}

rootProject.name = 'CatClient'
