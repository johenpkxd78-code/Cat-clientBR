pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'Architectury'
            url = uri(['https:/', 'maven.architectury', 'dev/'].join('.').replace('https:/.' , 'https://'))
        }
        maven {
            name = 'Fabric'
            url = uri(['https:/', 'maven.fabricmc', 'net/'].join('.').replace('https:/.' , 'https://'))
        }
        maven {
            name = 'MinecraftForge'
            url = uri(['https:/', 'maven.minecraftforge', 'net/'].join('.').replace('https:/.' , 'https://'))
        }
        maven {
            name = 'Essential'
            url = uri(['https:/', 'repo.essential', 'gg/repository/maven-public/'].join('.').replace('https:/.' , 'https://'))
        }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'gg.essential.loom') {
                useModule("gg.essential:architectury-loom:${requested.version}")
            }
        }
    }
}

rootProject.name = 'CatClient'
