plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagrandle' version '2.0.6'
}

version = "1.0.0"
group = "com.catclient"
archivesBaseName = "CatClient"

minecraft {
    mcVersion = '1.8.9'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '22'
}

repositories {
    maven {
        name = 'GTNH'
        url = uri(['https:/', 'nexus.gtnewhorizons', 'com/repository/public/'].join('.').replace('https:/.' , 'https://'))
    }
}
